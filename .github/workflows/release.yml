name: release

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the build to App Store Connect
        type: boolean
        default: false
      build_number:
        description: Build number (leave empty to use the run number)
        type: string
        required: false

jobs:
  archive:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
      DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are present
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID DIST_P12_BASE64 DIST_P12_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::secret $name is not set"; missing=1; fi
          done
          exit $missing

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Pick the build number
        run: |
          NUMBER="${{ inputs.build_number }}"
          if [ -z "$NUMBER" ]; then NUMBER="${{ github.run_number }}"; fi
          echo "BUILD_NUMBER=$NUMBER" >> "$GITHUB_ENV"

      - name: Archive and export
        run: |
          fastlane ios release \
            build_number:"$BUILD_NUMBER" \
            upload:"${{ inputs.upload }}"

      - name: Keep the ipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ravelane-${{ env.BUILD_NUMBER }}
          path: |
            build/*.ipa
            build/*.app.dSYM.zip
          retention-days: 30
          if-no-files-found: warn

      - name: Keep the logs when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fastlane-logs-${{ env.BUILD_NUMBER }}
          path: ~/Library/Logs/gym
          retention-days: 7
          if-no-files-found: ignore
