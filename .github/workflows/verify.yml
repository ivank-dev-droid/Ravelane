name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Architecture
        run: uname -m && swift --version
      - name: Test
        run: swift test --package-path Packages/RavelinCore
      - name: Catalog
        run: swift run --package-path Tools/RavelinCLI RavelinCLI verify

  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Architecture
        run: |
          uname -m
          swift --version
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::runner is not arm64 — the determinism check proves nothing here"
            exit 1
          fi
      - name: Test
        run: swift test --package-path Packages/RavelinCore
      - name: Catalog
        run: swift run --package-path Tools/RavelinCLI RavelinCLI verify
